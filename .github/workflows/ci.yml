name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System deps (OpenCV + WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
      - run: pip install ".[dev]"
      - name: Lint
        run: ruff check . && mypy ml api common
      - name: Tests + coverage gate (80%)
        run: pytest --cov=ml --cov=api --cov-report=term-missing --cov-fail-under=80
