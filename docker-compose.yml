# HemoSight — M Sujith Sali, ISE Dept, VTU Karnataka.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - HEMOSIGHT_DB_URL=sqlite:///hemosight_edge.db
      - HEMOSIGHT_JWT_SECRET=change-me
    depends_on: [mlflow]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=hemosight
      - POSTGRES_PASSWORD=hemosight
      - POSTGRES_DB=aggregation
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  aggregator:
    build: .
    command: python -m federated.server --strategy fedavg --rounds 10
    ports: ["8080:8080"]
    depends_on: [postgres]

volumes:
  mlflow_data:
  pg_data:
